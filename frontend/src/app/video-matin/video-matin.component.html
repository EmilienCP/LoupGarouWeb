@if (animationFinie) {
  <div @Fond style = "width: 100%; height: 100%; position: absolute;">
    @for (_ of [].constructor(8); track _; let i = $index) {
      <div class="image" [style]="'background-image:url(../../assets/soleilTentative' + (i) + '.jpg);width: 100%; height: 100%;background-size: cover;background-repeat: unset;position:absolute'"></div>
    }
  </div>
}


<div class="scene-wrapper">

  @if (!communicationService.infoPartie.isMeneurDeJeu && !infoEvenement!.passer) {
    <button class = "lgBouton lgAbsolu" style = "top: 90%; left: 80%; width: 20%; height: 5%;z-index: 10;" (click) = "ok()">Passer</button>
  }
  <!-- THREEJS -->
  <div #rendererContainerContainer
    class="three-container"
    [class.fadeOut]="animationFinie">

    <div class="scène-container">

      <div class="renderer-canvas"></div>

    </div>

  </div>
</div>


@if (isTextePendantLaNuit) {
  <div @PendantLaNuit class= "lgAbsolu lgTexte lgBlanc" style = "width: 100%; top: 75%; font-size: 120%;">{{textePendantLaNuit}}</div>
}
@if (isTexteJourSeLeve) {
  <div @JourSeLeve class= "lgAbsolu lgTexte lgBlanc" style = "width: 100%; top: 15%;font-size: 120%;">{{texteJourSeLeve}}</div>
}

@if (isInfoAppareil) {
  <app-creation-appareils
    (retourAppareil)="switchInfoAppareil();">
  </app-creation-appareils>
}
